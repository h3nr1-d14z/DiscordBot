services:
  bot:
    build: .
    container_name: discord-fun-bot
    restart: unless-stopped
    ports:
      - "8736:8736"   # health check server
      - "3000:3000"   # embedded app server (Discord Activities) — host cloudflared targets this
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      # src/ is deleted in the image, so the "npm run register" fallback is impossible here —
      # always sync global commands at boot instead (idempotent)
      - AUTO_REGISTER=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8736/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: discord-bot-network
