services:
  bot:
    build: .
    container_name: discord-fun-bot
    restart: unless-stopped
    ports:
      - "8736:8736"   # health check server
      - "3000:3000"   # embedded app server (Discord Activities) — tunnel targets this
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8736/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional Cloudflare tunnel — start with: docker compose --profile tunnel up -d
  # Requires TUNNEL_TOKEN=<token> in .env (Cloudflare Zero Trust dashboard)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: discord-bot-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - bot

networks:
  default:
    name: discord-bot-network
