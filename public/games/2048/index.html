<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #2b2d31;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #game-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        #score-container {
            margin-bottom: 20px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        
        #game-board {
            background-color: #bbada0;
            border-radius: 10px;
            padding: 10px;
            display: inline-block;
            position: relative;
        }
        
        #game-board.shake {
            animation: boardShake 0.3s ease-out;
        }
        
        @keyframes boardShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
        }
        
        .cell {
            width: 100px;
            height: 100px;
            background-color: #cdc1b4;
            border-radius: 5px;
        }
        
        #tiles {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        
        .tile {
            position: absolute;
            width: 100px;
            height: 100px;
            transition: transform 160ms cubic-bezier(0, 0, 0.58, 1);
            will-change: transform;
        }
        
        .tile.under { z-index: 1; }
        
        .tile-inner {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }
        
        .tile-inner.spawn {
            animation: spawnIn 180ms cubic-bezier(0, 0, 0.58, 1) backwards;
        }
        
        @keyframes spawnIn {
            from { transform: scale(0); }
        }
        
        .tile-inner.pop {
            animation: popIn 200ms cubic-bezier(0, 0, 0.58, 1);
        }
        
        @keyframes popIn {
            0% { transform: scale(1); }
            45% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        
        .tile-2 { background-color: #eee4da; color: #776e65; }
        .tile-4 { background-color: #ede0c8; color: #776e65; }
        .tile-8 { background-color: #f2b179; color: #f9f6f2; }
        .tile-16 { background-color: #f59563; color: #f9f6f2; }
        .tile-32 { background-color: #f67c5f; color: #f9f6f2; }
        .tile-64 { background-color: #f65e3b; color: #f9f6f2; }
        .tile-128 { background-color: #edcf72; color: #f9f6f2; font-size: 30px; }
        .tile-256 { background-color: #edcc61; color: #f9f6f2; font-size: 30px; }
        .tile-512 { background-color: #edc850; color: #f9f6f2; font-size: 30px; }
        .tile-1024 { background-color: #edc53f; color: #f9f6f2; font-size: 25px; }
        .tile-2048 { background-color: #edc22e; color: #f9f6f2; font-size: 25px; }
        
        .fscore {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            pointer-events: none;
            z-index: 5;
            animation: floatUp 700ms ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-45px); }
        }
        
        #controls {
            margin-top: 20px;
            font-size: 14px;
            color: #b9bbbe;
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        
        #game-over-content {
            text-align: center;
            color: white;
        }
        
        button {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-container">
            <div>Score: <span id="score">0</span></div>
            <div>Best: <span id="best">0</span></div>
        </div>
        <div id="game-board">
            <div class="grid-container" id="grid"></div>
            <div id="tiles"></div>
            <div id="game-over">
                <div id="game-over-content">
                    <h2 id="game-over-message">Game Over!</h2>
                    <p>Final Score: <span id="final-score">0</span></p>
                    <button id="game-over-new-game">New Game</button>
                </div>
            </div>
        </div>
        <div id="controls">Use arrow keys or swipe to play</div>
        <button id="new-game-button">New Game</button>
    </div>

    <script>
        // Game state
        let tiles = [];   // {r, c, v, el, inner}
        let score = 0;
        let best = localStorage.getItem('2048-best') || 0;
        let animating = false;
        const TILE = 100, GAP = 10;
        
        document.getElementById('best').textContent = best;
        
        function buildBackground() {
            const grid = document.getElementById('grid');
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                grid.appendChild(cell);
            }
        }
        
        function posOf(r, c) {
            return {x: c * (TILE + GAP), y: r * (TILE + GAP)};
        }
        
        function setTilePos(t) {
            const p = posOf(t.r, t.c);
            t.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        }
        
        function makeTile(r, c, v, spawn) {
            const el = document.createElement('div');
            el.className = 'tile';
            const inner = document.createElement('div');
            inner.className = 'tile-inner tile-' + v + (spawn ? ' spawn' : '');
            inner.textContent = v;
            el.appendChild(inner);
            document.getElementById('tiles').appendChild(el);
            const t = {r, c, v, el, inner};
            setTilePos(t);
            tiles.push(t);
            return t;
        }
        
        function removeTile(t) {
            t.el.remove();
            tiles = tiles.filter(x => x !== t);
        }
        
        function occupancy() {
            const occ = Array.from({length: 4}, () => Array(4).fill(null));
            for (const t of tiles) occ[t.r][t.c] = t;
            return occ;
        }
        
        function boardValues() {
            const b = Array.from({length: 4}, () => Array(4).fill(0));
            for (const t of tiles) b[t.r][t.c] = t.v;
            return b;
        }
        
        function addNewTile() {
            const occ = occupancy();
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (!occ[i][j]) emptyCells.push({row: i, col: j});
                }
            }
            
            if (emptyCells.length > 0) {
                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                makeTile(randomCell.row, randomCell.col, Math.random() < 0.9 ? 2 : 4, true);
            }
        }
        
        // Compact one line of tiles — merge math identical to the old filter+splice scan:
        // a tile that just merged cannot merge again in the same scan
        function compactLine(list) {
            const out = [];
            for (const t of list) {
                const last = out[out.length - 1];
                if (last && !last.merged && last.v === t.v) {
                    last.v *= 2;
                    last.merged = true;
                    last.absorbed = t;
                } else {
                    out.push({t, v: t.v, merged: false, absorbed: null});
                }
            }
            return out;
        }
        
        function move(direction) {
            if (animating) return;
            
            const occ = occupancy();
            const horiz = direction === 'left' || direction === 'right';
            const rev = direction === 'right' || direction === 'down';
            let moved = false;
            const absorbedTiles = [];
            const merges = [];   // {survivor, r, c, gain}
            
            for (let line = 0; line < 4; line++) {
                const list = [];
                for (let k = 0; k < 4; k++) {
                    const idx = rev ? 3 - k : k;
                    const t = horiz ? occ[line][idx] : occ[idx][line];
                    if (t) list.push(t);
                }
                
                compactLine(list).forEach((slot, target) => {
                    const pos = rev ? 3 - target : target;
                    const r = horiz ? line : pos;
                    const c = horiz ? pos : line;
                    if (slot.absorbed) {
                        moved = true;
                        slot.t.r = r;
                        slot.t.c = c;
                        slot.absorbed.r = r;
                        slot.absorbed.c = c;
                        absorbedTiles.push(slot.absorbed);
                        merges.push({survivor: slot.t, r, c, gain: slot.v});
                    } else if (slot.t.r !== r || slot.t.c !== c) {
                        moved = true;
                        slot.t.r = r;
                        slot.t.c = c;
                    }
                });
            }
            
            if (!moved) return;
            
            animating = true;
            score += merges.reduce((sum, m) => sum + m.gain, 0);
            
            // Slide: CSS transition on transform does the easing
            for (const t of absorbedTiles) t.el.classList.add('under');
            for (const t of tiles) setTilePos(t);
            
            setTimeout(() => {
                for (const t of absorbedTiles) removeTile(t);
                
                for (const m of merges) {
                    m.survivor.v *= 2;
                    m.survivor.inner.className = 'tile-inner tile-' + m.survivor.v;
                    m.survivor.inner.textContent = m.survivor.v;
                    void m.survivor.inner.offsetWidth;
                    m.survivor.inner.classList.add('pop');
                    floatText(m.r, m.c, m.gain);
                    
                    if (m.survivor.v >= 128) shakeBoard();
                }
                
                addNewTile();
                updateScore();
                animating = false;
                
                if (checkGameOver()) {
                    document.getElementById('final-score').textContent = score;
                    document.getElementById('game-over').style.display = 'flex';
                    
                    // Check for 2048 tile
                    const b = boardValues();
                    for (let i = 0; i < 4; i++) {
                        for (let j = 0; j < 4; j++) {
                            if (b[i][j] === 2048) {
                                document.getElementById('game-over-message').textContent = 'You Win!';
                                break;
                            }
                        }
                    }
                }
            }, 170);
        }
        
        function floatText(r, c, gain) {
            const f = document.createElement('div');
            f.className = 'fscore';
            f.textContent = '+' + gain;
            const p = posOf(r, c);
            f.style.left = p.x + 'px';
            f.style.top = p.y + 'px';
            document.getElementById('tiles').appendChild(f);
            f.addEventListener('animationend', () => f.remove());
        }
        
        function shakeBoard() {
            const board = document.getElementById('game-board');
            board.classList.remove('shake');
            void board.offsetWidth;
            board.classList.add('shake');
            board.addEventListener('animationend', () => board.classList.remove('shake'), {once: true});
        }
        
        function updateScore() {
            document.getElementById('score').textContent = score;
            if (score > best) {
                best = score;
                localStorage.setItem('2048-best', best);
                document.getElementById('best').textContent = best;
            }
        }
        
        function checkGameOver() {
            const board = boardValues();
            
            // Check for empty cells
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) return false;
                }
            }
            
            // Check for possible merges
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (j < 3 && board[i][j] === board[i][j + 1]) return false;
                    if (i < 3 && board[i][j] === board[i + 1][j]) return false;
                }
            }
            
            return true;
        }
        
        // Initialize game
        function init() {
            document.getElementById('tiles').innerHTML = '';
            tiles = [];
            score = 0;
            animating = false;
            document.getElementById('score').textContent = '0';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-over-message').textContent = 'Game Over!';
            addNewTile();
            addNewTile();
            updateScore();
        }
        
        function newGame() {
            init();
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') move('left');
            else if (e.key === 'ArrowRight') move('right');
            else if (e.key === 'ArrowUp') move('up');
            else if (e.key === 'ArrowDown') move('down');
        });
        
        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) move('left');
                else move('right');
            } else {
                if (diffY > 0) move('up');
                else move('down');
            }
            
            touchStartX = 0;
            touchStartY = 0;
        });
        
        // Add event listeners for buttons
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('new-game-button').addEventListener('click', newGame);
            document.getElementById('game-over-new-game').addEventListener('click', newGame);
        });
        
        // Start game
        buildBackground();
        init();
        console.log('2048 game started!');
    </script>
</body>
</html>
