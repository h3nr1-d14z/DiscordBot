<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: radial-gradient(ellipse at 50% -20%, #251d36 0%, #06070a 60%);
        color: #e7e9ea; font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 30px; perspective: 900px; }
    h1 { font-size: 26px; letter-spacing: 0.14em; color: #b980ff; }
    .table { display: flex; gap: 46px; }
    .die { width: 120px; height: 120px; position: relative; transform-style: preserve-3d; }
    .die.spin { animation: roll 0.9s cubic-bezier(.2,.7,.3,1); }
    @keyframes roll {
        0%   { transform: rotateX(0) rotateY(0) translateY(0); }
        35%  { transform: rotateX(380deg) rotateY(210deg) translateY(-90px); }
        70%  { transform: rotateX(700deg) rotateY(520deg) translateY(0); }
        100% { transform: rotateX(720deg) rotateY(720deg) translateY(0); }
    }
    .face {
        position: absolute; inset: 0; border-radius: 18px;
        background: linear-gradient(145deg, #fdfdff, #d8d9e2);
        display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 16px;
    }
    .face span { display: flex; align-items: center; justify-content: center; }
    .pip { width: 18px; height: 18px; border-radius: 50%; background: #17181d;
        box-shadow: inset 0 -2px 3px rgba(0,0,0,0.5); }
    .f1 { transform: translateZ(60px); }
    .f2 { transform: rotateY(90deg) translateZ(60px); }
    #sum { font-size: 44px; font-weight: 900; color: #fee75c; min-height: 56px; }
    #roll {
        font-size: 18px; font-weight: 700; padding: 14px 46px; border: none;
        border-radius: 12px; background: #5865f2; color: #fff; cursor: pointer;
        transition: transform 0.12s, box-shadow 0.12s;
    }
    #roll:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -8px #5865f2; }
    #roll:disabled { opacity: 0.5; transform: none; cursor: default; }
    #hist { color: #949ba4; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
    <h1>DICE ROLLER</h1>
    <div class="table">
        <div class="die" id="d1"></div>
        <div class="die" id="d2"></div>
    </div>
    <div id="sum"></div>
    <button id="roll">ROLL</button>
    <div id="hist"></div>
<script>
(() => {
    const $ = id => document.getElementById(id);
    const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    function faceHTML(n) {
        const cells = Array(9).fill('');
        PIPS[n].forEach(i => cells[i] = '<span><div class="pip"></div></span>');
        return cells.map(c => c || '<span></span>').join('');
    }
    // build six faces per die (4 visible sides rotated through)
    for (const id of ['d1', 'd2']) {
        const die = $(id);
        ['f1', 'f2'].forEach(cls => {
            const f = document.createElement('div');
            f.className = 'face ' + cls; f.innerHTML = faceHTML(1);
            die.appendChild(f);
        });
    }
    const hist = [];
    $('roll').onclick = () => {
        $('roll').disabled = true;
        const v1 = 1 + Math.floor(Math.random() * 6), v2 = 1 + Math.floor(Math.random() * 6);
        for (const [id, v] of [['d1', v1], ['d2', v2]]) {
            const die = $(id);
            die.classList.remove('spin'); void die.offsetWidth; die.classList.add('spin');
            setTimeout(() => { die.querySelectorAll('.face').forEach((f, i) => f.innerHTML = faceHTML(i === 0 ? v : (v % 6) + 1)); }, 850);
        }
        setTimeout(() => {
            $('sum').textContent = v1 + v2;
            hist.unshift(`${v1} + ${v2} = ${v1 + v2}`);
            $('hist').textContent = 'Recent: ' + hist.slice(0, 5).join('  ·  ');
            $('roll').disabled = false;
        }, 950);
    };
})();
</script>
</body>
</html>
