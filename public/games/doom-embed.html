<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        #doom-canvas {
            width: 100vw; height: 100vh;
            object-fit: contain;
            image-rendering: pixelated;
            background: #000;
            display: none;
        }
        #start-overlay {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 18px;
            background: #000;
            color: #ff2a2a;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        #start-overlay h1 {
            font-size: min(14vw, 96px);
            letter-spacing: 0.15em;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(255, 42, 42, 0.6);
            font-family: Georgia, serif;
        }
        #start-overlay .sub { color: #b9bbbe; font-size: 15px; }
        #start-overlay .go {
            margin-top: 10px;
            padding: 14px 44px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: #ff2a2a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #start-overlay .go:hover { background: #ff5c5c; }
        #start-overlay .legal { color: #666; font-size: 11px; position: fixed; bottom: 10px; left: 0; right: 0; }
    </style>
</head>
<body>
    <canvas id="doom-canvas" width="320" height="200"></canvas>
    <div id="start-overlay">
        <h1>DOOM</h1>
        <div class="sub">Doom 1 shareware &mdash; Knee-Deep in the Dead</div>
        <button class="go" id="start-btn">CLICK TO PLAY</button>
        <div class="legal">Keyboard: arrows/WASD + Ctrl fire, Space use, Shift run, E interact &mdash; DOOM &copy; id Software</div>
    </div>
    <script type="module">
        import { createDoomRuntime } from './doom/doom.mjs';

        const canvas = document.getElementById('doom-canvas');
        const overlay = document.getElementById('start-overlay');
        let doom = null;

        async function start() {
            overlay.removeEventListener('click', start);
            overlay.style.display = 'none';
            canvas.style.display = 'block';

            const [wad, wasm] = await Promise.all([
                fetch('doom/DOOM1.WAD').then(r => r.arrayBuffer()),
                fetch('doom/doom.wasm').then(r => r.arrayBuffer()),
            ]);

            doom = await createDoomRuntime({
                canvas,
                wad: new Uint8Array(wad),
                wasm: new Uint8Array(wasm),
            });
        }

        overlay.addEventListener('click', start);
    </script>
</body>
</html>
