<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: radial-gradient(ellipse at 50% -20%, #302718 0%, #06070a 60%);
        color: #e7e9ea; font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 20px; }
    h1 { font-size: 26px; letter-spacing: 0.14em; color: #ff9f43; }
    svg { width: 190px; height: 210px; }
    svg * { stroke: #b9bbbe; stroke-width: 4; stroke-linecap: round; fill: none; }
    svg .part { opacity: 0; transition: opacity 0.4s ease; }
    svg .part.on { opacity: 1; }
    #word { font-size: 34px; letter-spacing: 12px; font-weight: 700; min-height: 46px;
        font-family: 'Courier New', monospace; }
    #word .hit { color: #57f287; }
    #word .miss { color: #f23f43; text-decoration: line-through; }
    #keys { display: grid; grid-template-columns: repeat(9, 44px); gap: 7px; }
    #keys button {
        height: 46px; border-radius: 9px; border: 1px solid #3f4147; background: #17181d;
        color: #e7e9ea; font-size: 17px; font-weight: 700; cursor: pointer;
        transition: transform 0.1s, background 0.15s;
    }
    #keys button:hover:not(:disabled) { transform: translateY(-2px); border-color: #ff9f43; }
    #keys button.hit { background: #1d3a2a; color: #57f287; border-color: #23a55a; }
    #keys button.miss { background: #3a1d1d; color: #f23f43; border-color: #7f2d2d; opacity: 0.75; }
    #keys button:disabled { cursor: default; }
    #msg { font-size: 20px; font-weight: 800; min-height: 28px; }
    #again { display: none; font-size: 15px; font-weight: 700; padding: 10px 30px; border: none;
        border-radius: 10px; background: #5865f2; color: #fff; cursor: pointer; }
    #again.show { display: block; }
</style>
</head>
<body>
    <h1>HANGMAN</h1>
    <svg viewBox="0 0 190 210">
        <line x1="20" y1="190" x2="90" y2="190"/>
        <line x1="55" y1="190" x2="55" y2="20"/>
        <line x1="55" y1="20" x2="130" y2="20"/>
        <line x1="130" y1="20" x2="130" y2="45"/>
        <g class="part" data-i="0"><circle cx="130" cy="62" r="16"/></g>
        <g class="part" data-i="1"><line x1="130" y1="78" x2="130" y2="130"/></g>
        <g class="part" data-i="2"><line x1="130" y1="92" x2="108" y2="115"/></g>
        <g class="part" data-i="3"><line x1="130" y1="92" x2="152" y2="115"/></g>
        <g class="part" data-i="4"><line x1="130" y1="130" x2="110" y2="168"/></g>
        <g class="part" data-i="5"><line x1="130" y1="130" x2="150" y2="168"/></g>
    </svg>
    <div id="word"></div>
    <div id="msg"></div>
    <div id="keys"></div>
    <button id="again">NEW WORD</button>
<script>
(() => {
    const WORDS = ['discord', 'javascript', 'laser', 'galaxy', 'wizard', 'network', 'rhythm',
        'puzzle', 'oxygen', 'jungle', 'shadow', 'quantum', 'robot', 'vortex', 'phoenix'];
    const $ = id => document.getElementById(id);
    let word, guessed, misses, over;
    function newGame() {
        word = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
        guessed = new Set(); misses = 0; over = false;
        document.querySelectorAll('svg .part').forEach(p => p.classList.remove('on'));
        $('keys').innerHTML = '';
        for (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
            const b = document.createElement('button');
            b.textContent = ch;
            b.onclick = () => guess(ch, b);
            $('keys').appendChild(b);
        }
        $('msg').textContent = ''; $('again').classList.remove('show');
        drawWord(null);
    }
    function drawWord(reveal) {
        $('word').innerHTML = [...word].map(ch => {
            if (guessed.has(ch)) return `<span class="hit">${ch}</span>`;
            if (reveal) return `<span class="miss">${ch}</span>`;
            return '<span>_</span>';
        }).join('');
    }
    function guess(ch, btn) {
        if (over || guessed.has(ch)) return;
        guessed.add(ch);
        btn.disabled = true;
        if (word.includes(ch)) {
            btn.classList.add('hit');
            drawWord(false);
            if ([...word].every(c => guessed.has(c))) {
                over = true;
                $('msg').textContent = '🎉 YOU GOT IT!';
                $('msg').style.color = '#57f287';
                $('again').classList.add('show');
            }
        } else {
            btn.classList.add('miss');
            misses++;
            document.querySelector(`svg .part[data-i="${misses - 1}"]`)?.classList.add('on');
            if (misses >= 6) {
                over = true;
                drawWord(true);
                $('msg').textContent = '💀 Game over';
                $('msg').style.color = '#f23f43';
                $('again').classList.add('show');
            }
        }
    }
    $('again').onclick = newGame;
    newGame();
})();
</script>
</body>
</html>
