<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: radial-gradient(ellipse at 50% -20%, #2a1230 0%, #06070a 60%);
        color: #e7e9ea; font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 22px; }
    h1 { font-size: 26px; letter-spacing: 0.14em; color: #eb459e; }
    #board { display: grid; grid-template-columns: repeat(4, 96px); gap: 14px; }
    .card { width: 96px; height: 96px; perspective: 700px; cursor: pointer; }
    .inner { position: relative; width: 100%; height: 100%; transition: transform 0.4s cubic-bezier(.3,1.3,.5,1);
        transform-style: preserve-3d; }
    .card.open .inner { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px;
        display: flex; align-items: center; justify-content: center; }
    .back { background: linear-gradient(150deg, #5865f2, #3c45a5); font-size: 34px; color: #ffffff55; }
    .front { background: linear-gradient(150deg, #20222b, #14151a); transform: rotateY(180deg); font-size: 44px; }
    .card.matched .front { background: linear-gradient(150deg, #1d3a2a, #12271b); outline: 2px solid #23a55a; }
    .card.matched .inner { animation: pop 0.35s ease; }
    @keyframes pop { 50% { transform: rotateY(180deg) scale(1.14); } }
    #bar { display: flex; gap: 34px; color: #949ba4; font-size: 15px; }
    #bar b { color: #fff; font-size: 17px; }
    #msg { font-size: 22px; font-weight: 800; min-height: 30px; color: #57f287; }
    #again { display: none; font-size: 15px; font-weight: 700; padding: 10px 30px; border: none;
        border-radius: 10px; background: #5865f2; color: #fff; cursor: pointer; }
    #again.show { display: block; }
</style>
</head>
<body>
    <h1>MEMORY MATCH</h1>
    <div id="bar"><span>Moves <b id="moves">0</b></span><span>Pairs <b id="pairs">0</b>/8</span></div>
    <div id="board"></div>
    <div id="msg"></div>
    <button id="again">PLAY AGAIN</button>
<script>
(() => {
    const SYMS = ['🍓', '🍉', '🚀', '🐙', '🌵', '🍄', '🦋', '⚡'];
    const $ = id => document.getElementById(id);
    let deck, open, moves, pairs, lock;
    function deal() {
        deck = [...SYMS, ...SYMS].sort(() => Math.random() - 0.5);
        open = []; moves = 0; pairs = 0; lock = false;
        $('moves').textContent = 0; $('pairs').textContent = 0;
        $('msg').textContent = ''; $('again').classList.remove('show');
        $('board').innerHTML = deck.map(s => `
            <div class="card"><div class="inner">
                <div class="face back">?</div>
                <div class="face front">${s}</div>
            </div></div>`).join('');
        [...$('board').children].forEach((el, i) => el.onclick = () => pick(el, i));
    }
    function pick(el, i) {
        if (lock || el.classList.contains('open')) return;
        el.classList.add('open');
        open.push({ el, sym: deck[i] });
        if (open.length === 2) {
            lock = true; moves++; $('moves').textContent = moves;
            const [a, b] = open;
            if (a.sym === b.sym) {
                setTimeout(() => {
                    a.el.classList.add('matched'); b.el.classList.add('matched');
                    open = []; lock = false; pairs++; $('pairs').textContent = pairs;
                    if (pairs === 8) {
                        $('msg').textContent = `Cleared in ${moves} moves!`;
                        $('again').classList.add('show');
                    }
                }, 380);
            } else {
                setTimeout(() => { a.el.classList.remove('open'); b.el.classList.remove('open'); open = []; lock = false; }, 750);
            }
        }
    }
    $('again').onclick = deal;
    deal();
})();
</script>
</body>
</html>
