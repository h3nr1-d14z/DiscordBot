<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: radial-gradient(ellipse at 50% -20%, #1d2a24 0%, #06070a 60%);
        color: #e7e9ea; font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 26px; }
    h1 { font-size: 26px; letter-spacing: 0.12em; color: #23a55a; }
    .arena { display: flex; gap: 40px; align-items: center; }
    .side { text-align: center; }
    .fist { font-size: 88px; line-height: 1.2; min-height: 110px;
        transition: transform 0.15s; }
    .side .lbl { color: #949ba4; font-size: 13px; margin-top: 8px; }
    .shake-left  { animation: sl 0.4s 3; }
    .shake-right { animation: sr 0.4s 3; }
    @keyframes sl { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(10deg) translateY(-12px); } }
    @keyframes sr { 0%,100% { transform: rotate(14deg) scaleX(-1); } 50% { transform: rotate(-10deg) scaleX(-1) translateY(-12px); } }
    .flip { transform: scaleX(-1); }
    #result { font-size: 30px; font-weight: 900; min-height: 42px; letter-spacing: 0.05em; }
    #score { color: #949ba4; font-size: 15px; }
    #score b { color: #fff; }
    .choices { display: flex; gap: 16px; }
    .choices button {
        font-size: 44px; width: 88px; height: 88px; border-radius: 20px; border: 1px solid #2f3640;
        background: linear-gradient(160deg, #171a1f, #0d0f13); cursor: pointer;
        transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .choices button:hover { transform: translateY(-4px) scale(1.06); border-color: #23a55a;
        box-shadow: 0 8px 26px -6px #23a55a; }
    .choices button:active { transform: scale(0.94); }
    .choices button:disabled { opacity: 0.45; cursor: default; transform: none; }
</style>
</head>
<body>
    <h1>ROCK · PAPER · SCISSORS</h1>
    <div class="arena">
        <div class="side"><div class="fist" id="left">✊</div><div class="lbl">You</div></div>
        <div class="side"><div class="fist flip" id="right">✊</div><div class="lbl">AI</div></div>
    </div>
    <div id="result">Choose your move</div>
    <div id="score">You <b id="sw">0</b> — <b id="sl">0</b> AI · draws <b id="sd">0</b></div>
    <div class="choices">
        <button data-m="rock">✊</button><button data-m="paper">✋</button><button data-m="scissors">✌️</button>
    </div>
<script>
(() => {
    const EMOJI = { rock: '✊', paper: '✋', scissors: '✌️' };
    const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
    const $ = id => document.getElementById(id);
    let busy = false, w = 0, l = 0, d = 0;

    document.querySelectorAll('.choices button').forEach(btn => btn.onclick = () => {
        if (busy) return;
        busy = true;
        document.querySelectorAll('.choices button').forEach(b => b.disabled = true);
        const mine = btn.dataset.m;
        $('result').textContent = '';
        $('left').textContent = $('right').textContent = '✊';
        $('left').classList.add('shake-left'); $('right').classList.add('shake-right');
        setTimeout(() => {
            $('left').classList.remove('shake-left'); $('right').classList.remove('shake-right');
            const ai = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
            $('left').textContent = EMOJI[mine];
            $('right').textContent = EMOJI[ai];
            const verdict = mine === ai ? 'draw' : BEATS[mine] === ai ? 'win' : 'lose';
            if (verdict === 'win') { w++; $('result').textContent = 'YOU WIN!'; $('result').style.color = '#57f287'; }
            else if (verdict === 'lose') { l++; $('result').textContent = 'AI WINS'; $('result').style.color = '#f23f43'; }
            else { d++; $('result').textContent = "IT'S A DRAW"; $('result').style.color = '#fee75c'; }
            $('sw').textContent = w; $('sl').textContent = l; $('sd').textContent = d;
            document.querySelectorAll('.choices button').forEach(b => b.disabled = false);
            busy = false;
        }, 1250);
    });
})();
</script>
</body>
</html>
