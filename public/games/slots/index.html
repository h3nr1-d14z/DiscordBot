<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Slots</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: radial-gradient(ellipse at 50% -20%, #362a12 0%, #06070a 60%);
        color: #e7e9ea; font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 28px; }
    h1 { font-size: 26px; letter-spacing: 0.14em; color: #ffd700; }
    .machine {
        background: linear-gradient(160deg, #1d1520, #100c13); border: 2px solid #3d3020;
        border-radius: 22px; padding: 30px 34px; display: flex; gap: 18px;
        box-shadow: 0 0 40px -10px #ffd70055 inset, 0 18px 40px -12px #000;
    }
    .reel {
        width: 96px; height: 120px; border-radius: 12px; overflow: hidden;
        background: #0b0a0d; border: 1px solid #2c2436; position: relative;
    }
    .strip { display: flex; flex-direction: column; transition: none; }
    .strip .sym { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 54px; }
    .reel.spinning .strip { animation: spin 0.28s linear infinite; }
    @keyframes spin { to { transform: translateY(-120px); } }
    .reel::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(#0009 0%, transparent 30%, transparent 70%, #0009 100%); }
    #spin {
        font-size: 19px; font-weight: 800; letter-spacing: 0.1em; padding: 15px 60px;
        border: none; border-radius: 12px; background: linear-gradient(#ffd700, #d4a800);
        color: #17130a; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s;
    }
    #spin:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 30px -6px #ffd70088; }
    #spin:disabled { filter: grayscale(0.7); opacity: 0.6; cursor: default; }
    #result { font-size: 26px; font-weight: 900; min-height: 36px; letter-spacing: 0.05em; }
    #stats { color: #949ba4; font-size: 14px; }
    #stats b { color: #fff; }
    .lit { animation: litflash 0.5s ease 3; }
    @keyframes litflash { 50% { transform: scale(1.16); filter: drop-shadow(0 0 14px #ffd700); } }
</style>
</head>
<body>
    <h1>LUCKY SLOTS</h1>
    <div class="machine">
        <div class="reel"><div class="strip" id="s1"></div></div>
        <div class="reel"><div class="strip" id="s2"></div></div>
        <div class="reel"><div class="strip" id="s3"></div></div>
    </div>
    <div id="result">Match 3 to win big!</div>
    <div id="stats">Spins <b id="spins">0</b> · Wins <b id="wins">0</b> · Best streak <b id="streak">0</b></div>
    <button id="spin">SPIN</button>
<script>
(() => {
    const SYMS = ['🍒', '🍋', '🍇', '💎', '7️⃣', '⭐'];
    const $ = id => document.getElementById(id);
    const reels = ['s1', 's2', 's3'].map(id => {
        const el = $(id);
        el.innerHTML = Array(4).fill(SYMS.map(s => `<div class="sym">${s}</div>`).join('')).join('');
        return el;
    });
    let spinning = false, spins = 0, wins = 0, streak = 0, best = 0;
    $('spin').onclick = () => {
        if (spinning) return;
        spinning = true; $('spin').disabled = true;
        $('result').textContent = ''; $('result').style.color = '';
        reels.forEach(r => r.parentElement.classList.add('spinning'));
        const out = [0, 0, 0].map(() => Math.floor(Math.random() * SYMS.length));
        const stops = [900, 1400, 1900];
        reels.forEach((r, i) => setTimeout(() => {
            r.parentElement.classList.remove('spinning');
            r.style.transform = `translateY(${-out[i] * 120 - 120}px)`;
            setTimeout(() => {
                r.innerHTML = Array(3).fill(`<div class="sym">${SYMS[out[i]]}</div>`).join('');
                r.style.transform = 'translateY(0)';
            }, 30);
        }, stops[i]));
        setTimeout(() => {
            const win = out[0] === out[1] && out[1] === out[2];
            spins++;
            if (win) {
                wins++; streak++; best = Math.max(best, streak);
                $('result').textContent = out[0] === 4 ? '💥 JACKPOT!' : 'WINNER!';
                $('result').style.color = '#ffd700';
                reels.forEach(r => r.classList.add('lit'));
                setTimeout(() => reels.forEach(r => r.classList.remove('lit')), 1600);
            } else {
                streak = 0;
                $('result').textContent = 'No match — try again';
                $('result').style.color = '#949ba4';
            }
            $('spins').textContent = spins; $('wins').textContent = wins; $('streak').textContent = best;
            $('spin').disabled = false; spinning = false;
        }, 2200);
    };
})();
</script>
</body>
</html>
