<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #2b2d31;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        #game-container {
            text-align: center;
        }
        
        #game-container.shake {
            animation: shake 0.35s ease-out;
        }
        
        @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-5px,2px); } 40% { transform: translate(4px,-3px); } 60% { transform: translate(-3px,-2px); } 80% { transform: translate(3px,2px); } }
        
        #score {
            font-size: 24px;
            margin-bottom: 10px;
            display: inline-block;
        }
        
        #score.pop {
            animation: scorePop 0.3s ease-out;
        }
        
        @keyframes scorePop { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: #7289da; } 100% { transform: scale(1); } }
        
        canvas {
            border: 2px solid #5865f2;
            background-color: #1e1f22;
            display: block;
        }
        
        #controls {
            margin-top: 10px;
            font-size: 14px;
            color: #b9bbbe;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s;
        }
        
        #game-over.show {
            opacity: 1;
            visibility: visible;
        }
        
        button {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score">Score: 0 | Best: 0</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="controls">Use arrow keys or WASD to play</div>
    </div>
    
    <div id="game-over">
        <h2>Game Over!</h2>
        <p>Your Score: <span id="final-score">0</span></p>
        <button id="play-again-button">Play Again</button>
    </div>

    <script>
        // Game setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const scoreEl = document.getElementById('score');
        
        let snake = [{x: 10, y: 10}];
        let prevSnake = [{x: 10, y: 10}];   // positions from previous logic tick (for interpolation)
        let dx = 0;
        let dy = 0;
        let foodX = 15;
        let foodY = 15;
        let score = 0;
        let best = localStorage.getItem('snake-best') || 0;
        let gameRunning = true;
        let tickMs = 100;   // logic tick duration; shrinks smoothly as score grows
        let acc = 0;        // ms accumulated toward the next logic tick
        let lastTime = 0;
        let particles = [];
        const roundRect = ctx.roundRect
            ? (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
            : (x, y, w, h) => ctx.fillRect(x, y, w, h);
        
        updateScore();
        
        // Logic tick: rules identical to before, just decoupled from rendering
        function step() {
            if (dx === 0 && dy === 0) {
                prevSnake = snake.map(s => ({...s}));
                return;
            }
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
            prevSnake = snake.map(s => ({...s}));
            snake.unshift(head);
            if (head.x === foodX && head.y === foodY) {
                score += 10;
                updateScore(true);
                spawnParticles(foodX, foodY);
                generateFood();
                tickMs = Math.max(55, 100 - score * 0.15);
            } else {
                snake.pop();
            }
        }
        
        // Head #7289da -> tail #4752c4 gradient
        function segColor(f) {
            const lerp = (a, b) => Math.round(a + (b - a) * f);
            return `rgb(${lerp(114, 71)},${lerp(137, 82)},${lerp(218, 196)})`;
        }
        
        function spawnParticles(gx, gy) {
            const colors = ['#ed4245', '#5865f2', '#7289da', '#ffffff'];
            for (let i = 0; i < 12; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 40 + Math.random() * 120;
                particles.push({
                    x: gx * gridSize + gridSize / 2,
                    y: gy * gridSize + gridSize / 2,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp,
                    life: 1,
                    color: colors[i % colors.length]
                });
            }
        }
        
        function render(now) {
            ctx.fillStyle = '#1e1f22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Food: pulsing circle with glow
            const pulse = 1 + 0.15 * Math.sin(now / 180);
            ctx.save();
            ctx.shadowColor = '#ed4245';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ed4245';
            ctx.beginPath();
            ctx.arc(foodX * gridSize + gridSize / 2, foodY * gridSize + gridSize / 2, (gridSize / 2 - 3) * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // Snake: lerp each segment between its previous and current cell
            const t = gameRunning ? Math.min(acc / tickMs, 1) : 1;
            const len = snake.length;
            for (let i = len - 1; i >= 0; i--) {
                const from = prevSnake[i] || prevSnake[prevSnake.length - 1];
                const to = snake[i];
                const x = (from.x + (to.x - from.x) * t) * gridSize;
                const y = (from.y + (to.y - from.y) * t) * gridSize;
                const c = segColor(i / Math.max(len - 1, 1));
                ctx.save();
                if (i === 0) {
                    ctx.shadowColor = c;
                    ctx.shadowBlur = 12;
                }
                ctx.fillStyle = c;
                roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, 5);
                ctx.restore();
                if (i === 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    roundRect(x + 5, y + 5, gridSize - 10, gridSize - 10, 3);
                }
            }
            
            // Particles
            for (const p of particles) {
                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5 + 2.5 * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        
        function loop(now) {
            const dt = Math.min(now - lastTime, 100);   // cap so a background tab doesn't burst steps
            lastTime = now;
            if (gameRunning) {
                acc += dt;
                let steps = 0;
                while (acc >= tickMs && gameRunning && steps < 5) {
                    acc -= tickMs;
                    step();
                    steps++;
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt / 1000;
                p.y += p.vy * dt / 1000;
                p.vy += 300 * dt / 1000;
                p.life -= dt / 600;
                if (p.life <= 0) particles.splice(i, 1);
            }
            render(now);
            requestAnimationFrame(loop);
        }
        
        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === foodX && snake[i].y === foodY) {
                    generateFood();
                    return;
                }
            }
        }
        
        function updateScore(pop) {
            scoreEl.textContent = `Score: ${score} | Best: ${best}`;
            if (pop) {
                scoreEl.classList.remove('pop');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('pop');
            }
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').classList.add('show');
            const container = document.getElementById('game-container');
            container.classList.remove('shake');
            void container.offsetWidth;
            container.classList.add('shake');
            if (score > best) {
                best = score;
                localStorage.setItem('snake-best', best);
                updateScore();
            }
        }
        
        function resetGame() {
            snake = [{x: 10, y: 10}];
            prevSnake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            tickMs = 100;
            acc = 0;
            particles = [];
            gameRunning = true;
            updateScore();
            generateFood();
            document.getElementById('game-over').classList.remove('show');
            document.getElementById('game-container').classList.remove('shake');
        }
        
        // Controls
        document.addEventListener('keydown', changeDirection);
        
        function changeDirection(event) {
            if (!gameRunning) return;
            const key = event.key.toLowerCase();
            // Prevent going back into yourself
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;
            if ((key === 'arrowleft' || key === 'a') && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if ((key === 'arrowup' || key === 'w') && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if ((key === 'arrowright' || key === 'd') && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if ((key === 'arrowdown' || key === 's') && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }
        
        // Add event listener for play again button
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('play-again-button').addEventListener('click', resetGame);
        });
        
        // Start game
        generateFood();
        requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
        
        console.log('Snake game started!');
    </script>
</body>
</html>
